version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: appvideoai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - appvideoai_network

volumes:
  redis_data:
    driver: local

networks:
  appvideoai_network:
    driver: bridge
